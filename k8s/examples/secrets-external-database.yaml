apiVersion: v1
kind: Secret
metadata:
  name: airbyte-secrets
  namespace: airbyte
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # External Database Credentials
  # ⚠️ REPLACE WITH YOUR ACTUAL DATABASE CREDENTIALS
  DATABASE_USER: "airbyte"
  DATABASE_PASSWORD: "your-cloud-sql-password-here"  # ← REPLACE
  DATABASE_DB: "airbyte"

  # Minio Credentials
  # ⚠️ CHANGE THESE VALUES IN PRODUCTION!
  MINIO_ACCESS_KEY: "minio-admin"
  MINIO_SECRET_KEY: "minio-secret-key-change-me"

  # Basic Authentication for UI
  # ⚠️ CHANGE THESE VALUES IN PRODUCTION!
  BASIC_AUTH_USERNAME: "airbyte"
  BASIC_AUTH_PASSWORD: "password"

---
# Notes:
#
# For Cloud SQL:
# 1. Create Cloud SQL instance
# 2. Create database and user
# 3. Get the private IP or use Cloud SQL Proxy
# 4. Update DATABASE_PASSWORD with the password you set
# 5. Update configmap-external-database.yaml with DATABASE_HOST
#
# For external PostgreSQL:
# 1. Ensure network connectivity from GKE to PostgreSQL
# 2. Update DATABASE_USER, DATABASE_PASSWORD, DATABASE_DB
# 3. Update configmap with DATABASE_HOST and DATABASE_PORT
#
# See k8s/airbyte/optional/EXTERNAL_DATABASE.md for detailed instructions
