apiVersion: v1
kind: ServiceAccount
metadata:
  name: airbyte-sa
  namespace: airbyte
  annotations:
    # Replace PROJECT_ID with your actual GCP project ID
    # This annotation binds the Kubernetes service account to the Google service account
    iam.gke.io/gcp-service-account: airbyte-gsa@PROJECT_ID.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: service-account

---
# Instructions for Workload Identity Setup:
#
# 1. Replace PROJECT_ID above with your GCP project ID
#
# 2. Create Google Service Account:
#    gcloud iam service-accounts create airbyte-gsa \
#      --display-name="Airbyte GKE Service Account"
#
# 3. Bind Kubernetes SA to Google SA:
#    gcloud iam service-accounts add-iam-policy-binding \
#      airbyte-gsa@PROJECT_ID.iam.gserviceaccount.com \
#      --role roles/iam.workloadIdentityUser \
#      --member "serviceAccount:PROJECT_ID.svc.id.goog[airbyte/airbyte-sa]"
#
# 4. Grant additional permissions as needed (example for GCS):
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member "serviceAccount:airbyte-gsa@PROJECT_ID.iam.gserviceaccount.com" \
#      --role "roles/storage.objectAdmin"
#
# Or use the automated script: ./scripts/setup-workload-identity.sh
