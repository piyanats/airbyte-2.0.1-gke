apiVersion: v1
kind: Secret
metadata:
  name: airbyte-secrets
  namespace: airbyte
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials
  # ⚠️ CHANGE THESE VALUES IN PRODUCTION!
  DATABASE_USER: "airbyte"
  DATABASE_PASSWORD: "password"
  DATABASE_DB: "airbyte"

  # Minio Credentials
  # ⚠️ CHANGE THESE VALUES IN PRODUCTION!
  MINIO_ACCESS_KEY: "minio-admin"
  MINIO_SECRET_KEY: "minio-secret-key-change-me"

  # Basic Authentication for UI
  # ⚠️ CHANGE THESE VALUES IN PRODUCTION!
  BASIC_AUTH_USERNAME: "airbyte"
  BASIC_AUTH_PASSWORD: "password"

---
# Optional: API Token Secret for Backup CronJob
# Uncomment and add your API token when setting up automated backups
